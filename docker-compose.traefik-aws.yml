version: '3.8'

# Enterfind Server Docker Compose Configuration
# All configuration is self-contained within this file:
# - Traefik configuration (no separate config files needed)
# - Database initialization (no separate SQL files needed)
# - Complete environment-driven setup via .env file

services:
  postgres:
    image: postgres:16-alpine
    container_name: enterfind-postgres
    restart: unless-stopped
    environment:
      # PostgreSQL automatic initialization
      POSTGRES_DB: ${DB_NAME}          # Creates the application database
      POSTGRES_USER: ${DB_USER}        # Creates the application user with full db privileges
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Sets the user password
      # Additional PostgreSQL settings
      POSTGRES_INITDB_ARGS: "--auth-host=md5"  # Use MD5 auth for network connections
    # PostgreSQL configuration for extensions and performance
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterfind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    shm_size: 1gb

  enterfind-server:
    image: ${REGISTRY_URL}/enterfind-server:latest-${SPRING_PROFILE}
    container_name: enterfind-server-${SPRING_PROFILE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ENTERFIND_ENCRYPTION_KEY: ${ENTERFIND_ENCRYPTION_KEY}
      SERVER_PORT: 8080
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - enterfind-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.enterfind.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.enterfind.entrypoints=websecure"
      - "traefik.http.routers.enterfind.tls=true"
      - "traefik.http.routers.enterfind.tls.certresolver=letsencrypt"
      - "traefik.http.routers.enterfind.middlewares=security-headers,rate-limit"
      - "traefik.http.services.enterfind.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

  traefik:
    image: traefik:v3.6
    container_name: enterfind-traefik
    restart: unless-stopped
    command:
      # Global configuration
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
      
      # API and Dashboard
      - "--api.dashboard=true"
      - "--api.debug=false"
      
      # Entry points
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      
      # HTTP to HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.watch=true"
      
      # Let's Encrypt configuration
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.delayBeforeCheck=0"
      
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
      
      # Security headers and TLS
      - "--entrypoints.websecure.http.tls.options=default@file"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard (should be secured in production)
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID}
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - enterfind-network
    labels:
      - "traefik.enable=true"
      
      # Security headers middleware
      - "traefik.http.middlewares.security-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.X-XSS-Protection=1; mode=block"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.Strict-Transport-Security=max-age=31536000; includeSubDomains"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin"
      
      # Rate limiting middleware
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=100"
      - "traefik.http.middlewares.rate-limit.ratelimit.average=50"
      
      # Traefik dashboard routing
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth,security-headers"
      
      # Authentication middleware for dashboard
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH}"
      
      # Watchtower update management
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: enterfind-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_INTERVAL}
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.docker/config.json:/config.json:ro
    networks:
      - enterfind-network
    depends_on:
      - traefik
      - enterfind-server
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Don't update watchtower itself

networks:
  enterfind-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  traefik_letsencrypt:
    driver: local