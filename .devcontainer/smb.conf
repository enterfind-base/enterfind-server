[global]
   workgroup = WORKGROUP
   server string = Samba Server
   netbios name = SAMBA
   security = user
   map to guest = never
   log file = /var/log/samba/log.%m
   max log size = 50
   passdb backend = tdbsam
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   smb ports = 445

[scratch]
   path = /samba/shares/scratch
   browseable = yes
   writable = yes
   guest ok = no
   valid users = smbtest
   create mask = 0755
   directory mask = 0755
   force create mode = 0755
   force directory mode = 0755
