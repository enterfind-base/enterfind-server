spring.application.name=enterfind-server

# Application version - the Maven project version, which ci.yml sets with -Drevision
app.version=@project.version@

# Set alpha as the default profile
spring.profiles.default=alpha

spring.datasource.driver-class-name=org.postgresql.Driver

# GraphQL configuration
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.path=/graphql
spring.graphql.websocket.path=/graphql
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.allowed-headers=*

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

# Application info for info endpoint
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=Enterfind Server Application
info.app.java.version=${java.version}

# Scheduling: the treatment scheduler, its stuck-thread governor, and the idle-model unloader all
# run as @Scheduled tasks. With the default pool size of 1 they share a single thread, so one slow
# or blocked task silently disables the others — including the governor meant to detect that.
spring.task.scheduling.pool.size=4

# Content treatment configuration
# Maximum content size to extract (in characters) to prevent OOM errors. Default: 10MB (10485760)
enterfind.treatment.content.max-length=10485760

# Appliance mode — freeze this instance: no mutations, no background work.
# Set to true and restart to activate. Requires all users and datasources to be provisioned first.
# enterfind.appliance-mode=false
# enterfind.appliance-mode.ai-query-budget-per-day=100
