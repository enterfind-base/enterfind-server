# Alpha Profile Configuration
# Database configuration for local PostgreSQL testing
spring.datasource.url=jdbc:postgresql://localhost:5432/enterfind_test
spring.datasource.username=enterfind_test
spring.datasource.password=enterfind_test_password

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Server configuration - bind to all interfaces for container/codespace access
server.address=0.0.0.0
server.port=8080

# Logging configuration for development
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc=DEBUG