<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnterFind - Server Error</title>
    <script>
        // A legacy-shaped URL (remote-<stage>.enterfind.com/<serverId>/...) moves to the instance's
        // own origin, as js/remote.js does. This is the page's only script.
        var _m = location.hostname.match(/^remote-(.+)\.enterfind\.com$/);
        var _id = location.pathname.split('/')[1];
        if (_m && /^[0-9a-f]{12}$/.test(_id)) {
            location.replace('https://' + _id + '.remote-' + _m[1] + '.enterfind.com'
                + (location.pathname.slice(_id.length + 1) || '/') + location.search + location.hash);
        }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="error-header">
        <div class="container">
            <a href="/index.html" id="homeLink"><img src="/enterfind_logo.jpeg" id="logo" alt="EnterFind" style="height: 39px; vertical-align: middle;"></a>
        </div>
    </header>
    <main class="error-page">
        <div class="error-code error-danger">500</div>
        <p class="error-title">Server error</p>
        <a href="/index.html" id="homeLink2" class="error-home-link">Go home</a>
    </main>
</body>
</html>
