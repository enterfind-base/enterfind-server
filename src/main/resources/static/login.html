<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnterFind - Login</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background);
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            background: var(--background);
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-checkbox input {
            width: auto;
        }

        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        .login-btn:hover {
            background: var(--primary-dark);
        }

        .login-btn:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #ef4444;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message {
            background: #dcfce7;
            border: 1px solid #22c55e;
            color: #16a34a;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }

        .recovery-link {
            text-align: center;
            margin-top: 1rem;
        }

        .recovery-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .recovery-link a:hover {
            text-decoration: underline;
        }

        .recovery-form {
            display: none;
        }

        .back-link {
            margin-bottom: 1rem;
        }

        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .back-link a:hover {
            color: var(--primary);
        }

        .no-auth-message {
            text-align: center;
            padding: 2rem;
        }

        .no-auth-message h2 {
            margin-bottom: 1rem;
        }

        .setup-link {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Loading state -->
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
            </div>

            <!-- No auth required (first user setup) -->
            <div id="noAuthState" class="no-auth-message" style="display: none;">
                <h2>Welcome to EnterFind</h2>
                <p>No users have been set up yet. Create your first admin account to get started.</p>
                <div class="setup-link">
                    <a href="users.html" class="btn btn-primary">Set Up First User</a>
                </div>
            </div>

            <!-- Login form -->
            <div id="loginForm" style="display: none;">
                <div class="login-header">
                    <img src="enterfind_logo.jpeg" alt="EnterFind" style="height: 58px; margin-bottom: 1rem;">
                    <p>Sign in to your account</p>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <!-- Standard login -->
                <form id="standardLoginForm">
                    <div class="form-group">
                        <label for="nickname">Nickname</label>
                        <input type="text" id="nickname" name="nickname" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="totpCode">Authenticator Code</label>
                        <input type="text" id="totpCode" name="totpCode" required autocomplete="one-time-code"
                               pattern="[0-9]{6}" maxlength="6" placeholder="000000">
                    </div>
                    <div class="form-group">
                        <label class="form-checkbox">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span>Remember me for 30 days</span>
                        </label>
                    </div>
                    <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
                </form>

                <div class="recovery-link">
                    <a href="#" id="showRecoveryForm">Lost your authenticator? Use a recovery code</a>
                </div>
            </div>

            <!-- Recovery code login -->
            <div id="recoveryForm" class="recovery-form">
                <div class="back-link">
                    <a href="#" id="backToLogin">&larr; Back to login</a>
                </div>

                <div class="login-header">
                    <h1>Recovery Login</h1>
                    <p>Use one of your backup recovery codes</p>
                </div>

                <div id="recoveryErrorMessage" class="error-message"></div>

                <form id="recoveryLoginForm">
                    <div class="form-group">
                        <label for="recoveryNickname">Nickname</label>
                        <input type="text" id="recoveryNickname" name="nickname" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="recoveryCode">Recovery Code</label>
                        <input type="text" id="recoveryCode" name="recoveryCode" required
                               pattern="[A-Z0-9]{8}" maxlength="8" placeholder="XXXXXXXX"
                               style="text-transform: uppercase;">
                    </div>
                    <button type="submit" class="login-btn" id="recoveryLoginBtn">Sign In with Recovery Code</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            login,
            loginWithRecoveryCode,
            isAuthenticationRequired,
            isLoggedIn,
            getAuthUser
        } from './js/auth.js';
        import { showAlert } from './js/util.js';
        import { getUrl } from './js/remote.js';

        const $ = (id) => document.getElementById(id);

        async function init() {
            // Check if already logged in
            if (isLoggedIn()) {
                window.location.href = getUrl('/index.html');
                return;
            }

            // Check if auth is required
            const authRequired = await isAuthenticationRequired();

            $('loadingState').style.display = 'none';

            if (!authRequired) {
                // No users exist, show setup prompt
                $('noAuthState').style.display = 'block';
            } else {
                // Auth required, show login form
                $('loginForm').style.display = 'block';
            }
        }

        // Standard login form
        $('standardLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nickname = $('nickname').value.trim();
            const totpCode = $('totpCode').value.trim();
            const rememberMe = $('rememberMe').checked;

            $('errorMessage').style.display = 'none';
            $('loginBtn').disabled = true;
            $('loginBtn').textContent = 'Signing in...';

            try {
                await login(nickname, totpCode, rememberMe);
                $('successMessage').textContent = 'Login successful! Redirecting...';
                $('successMessage').style.display = 'block';
                setTimeout(() => {
                    window.location.href = getUrl('/index.html');
                }, 500);
            } catch (error) {
                $('errorMessage').textContent = error.message || 'Login failed. Please try again.';
                $('errorMessage').style.display = 'block';
                $('loginBtn').disabled = false;
                $('loginBtn').textContent = 'Sign In';
            }
        });

        // Recovery code login form
        $('recoveryLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nickname = $('recoveryNickname').value.trim();
            const recoveryCode = $('recoveryCode').value.trim().toUpperCase();

            $('recoveryErrorMessage').style.display = 'none';
            $('recoveryLoginBtn').disabled = true;
            $('recoveryLoginBtn').textContent = 'Signing in...';

            try {
                const result = await loginWithRecoveryCode(nickname, recoveryCode);

                // Warn about remaining recovery codes
                if (result.user.recoveryCodesRemaining <= 3) {
                    await showAlert(`Warning: You only have ${result.user.recoveryCodesRemaining} recovery codes remaining. Please set up your authenticator or generate new recovery codes.`);
                }

                window.location.href = getUrl('/index.html');
            } catch (error) {
                $('recoveryErrorMessage').textContent = error.message || 'Login failed. Please try again.';
                $('recoveryErrorMessage').style.display = 'block';
                $('recoveryLoginBtn').disabled = false;
                $('recoveryLoginBtn').textContent = 'Sign In with Recovery Code';
            }
        });

        // Toggle between standard and recovery login
        $('showRecoveryForm').addEventListener('click', (e) => {
            e.preventDefault();
            $('loginForm').querySelector('form').style.display = 'none';
            $('loginForm').querySelector('.recovery-link').style.display = 'none';
            $('recoveryForm').style.display = 'block';
            // Copy nickname if entered
            $('recoveryNickname').value = $('nickname').value;
        });

        $('backToLogin').addEventListener('click', (e) => {
            e.preventDefault();
            $('recoveryForm').style.display = 'none';
            $('loginForm').querySelector('form').style.display = 'block';
            $('loginForm').querySelector('.recovery-link').style.display = 'block';
        });

        // Auto-format TOTP code input
        $('totpCode').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Auto-format recovery code input
        $('recoveryCode').addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });

        init();
    </script>
</body>
</html>
