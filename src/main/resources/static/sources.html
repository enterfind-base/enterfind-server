<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sources - EnterFind</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-left">
                <a href="index.html" class="navbar-brand"><img src="enterfind_logo.jpeg" alt="EnterFind" style="height: 39px; vertical-align: middle;"></a>
                <span id="server-version" class="navbar-version"></span>
            </div>
            <ul class="navbar-nav">
                <li><a href="index.html">Search</a></li>
                <li><a href="sources.html" class="active">Data Sources</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="users.html">Users</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <h1 class="page-title">Data Sources</h1>
            <a href="source.html?new=true" class="btn btn-primary">+ Add Data Source</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div id="loadingState" class="loading">
            <div class="spinner"></div>
        </div>
        
        <div id="errorState" class="alert alert-error" style="display: none;"></div>
        
        <div id="sourcesGrid" class="sources-grid">
            <!-- Data sources will be populated dynamically -->
        </div>
        
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📁</div>
            <div class="empty-state-title">No Data Sources</div>
            <p>Add a data source to start indexing your files.</p>
        </div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Confirm Delete</h2>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete the data source "<strong id="deleteSourceName"></strong>"?</p>
                <p>This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/sources.js"></script>
    <script type="module">
        import { checkAuthAndRedirect } from './js/auth.js';
        import { initFooter } from './js/footer.js';
        await checkAuthAndRedirect();
        initFooter();
    </script>
</body>
</html>
