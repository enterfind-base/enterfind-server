<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details - EnterFind</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-left">
                <a href="index.html" class="navbar-brand"><img src="enterfind_logo.jpeg" alt="EnterFind" style="height: 39px; vertical-align: middle;"></a>
                <span id="server-version" class="navbar-version"></span>
            </div>
            <ul class="navbar-nav">
                <li><a href="index.html">Search</a></li>
                <li><a href="sources.html">Data Sources</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="users.html">Users</a></li>
            </ul>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <div class="container">
            <div>
                <a href="index.html" class="btn btn-secondary btn-sm" style="margin-bottom: 0.5rem;">← Back to Search</a>
                <h1 class="page-title" id="itemTitle">Item Details</h1>
            </div>
        </div>
    </header>

    <!-- Lightbox overlay -->
    <div id="imageLightbox" style="display:none;" role="dialog" aria-modal="true" aria-label="Image preview">
        <img id="imageLightboxImg" src="" alt="">
    </div>

    <!-- Main Content -->
    <main class="container">
        <div class="item-detail">
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
            </div>
            
            <div id="errorState" class="alert alert-error" style="display: none;"></div>
            
            <div id="itemContent" class="card" style="display: none;">
                <div class="card-header">
                    <h2 class="card-title">File Information</h2>
                </div>
                <div class="card-body">
                    <div id="itemDetails" class="detail-grid">
                        <!-- Details will be populated dynamically -->
                    </div>
                </div>
            </div>
            
            <!-- Item Attributes Card -->
            <div id="attributesContent" class="card" style="display: none; margin-top: 1.5rem;">
                <div class="card-header">
                    <h2 class="card-title">Attributes</h2>
                </div>
                <div class="card-body">
                    <div id="attributesList" class="detail-grid">
                        <!-- Attributes will be populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- Delete File Card -->
            <div id="deleteFileCard" class="card" style="display: none; margin-top: 1.5rem;">
                <div class="card-header">
                    <h2 class="card-title">Delete File</h2>
                </div>
                <div class="card-body">
                    <p style="color: var(--danger); font-weight: 500; margin-bottom: 1rem;">
                        Warning: Deleting this file will permanently remove it from the original data source. This action cannot be undone.
                    </p>
                    <button id="deleteFileBtn" class="btn btn-danger">Delete File</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { $, escapeHtml, formatDate, formatFileSize, buildDownloadUrl, buildPreviewUrl, buildFaceCropUrl, showAlert, showConfirm, showPrompt, BROWSER_IMAGE_TYPES } from './js/util.js';
        import { searchItems, getItemAttributes, fetchServerTimezone, deleteItem, renameFaceLabel, getFacets } from './js/api.js';
        import { checkAuthAndRedirect } from './js/auth.js';
        import { initFooter } from './js/footer.js';

        // Auth check
        await checkAuthAndRedirect();
        initFooter();
        // Fetch server timezone for proper date formatting
        fetchServerTimezone();

        // Get item details from URL
        const params = new URLSearchParams(window.location.search);
        const itemName = decodeURIComponent(params.get('name') || '');
        const itemFolder = decodeURIComponent(params.get('folder') || '');
        const dataSourceName = decodeURIComponent(params.get('ds') || '');
        const dataSourceType = params.get('dsType') || '';

        // Get search context for highlighting
        const searchString = params.get('q') || '';
        const searchConditions = params.get('conditions') ? JSON.parse(params.get('conditions')) : [];
        const selectedFacet = params.get('facet') || '';

        // Store item globally for use in renderAttributes
        let currentItem = null;

        // Note: modules are deferred and top-level await may complete after DOMContentLoaded,
        // so we check readyState instead of relying on the event
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        function init() {
            if (!itemName) {
                showError('No item specified');
                return;
            }
            updateBackLink();
            loadItemDetails();
        }

        /**
         * Update the "Back to Search" link to preserve search criteria
         */
        function updateBackLink() {
            const backLinkParams = new URLSearchParams();
            
            if (searchString) {
                backLinkParams.set('q', searchString);
            }
            
            if (searchConditions && searchConditions.length > 0) {
                // URLSearchParams encodes on toString(); JSON.stringify only.
                backLinkParams.set('conditions', JSON.stringify(searchConditions));
            }

            if (selectedFacet) {
                backLinkParams.set('facet', selectedFacet);
            }

            // Build the back URL
            const backUrl = backLinkParams.toString() 
                ? `index.html?${backLinkParams.toString()}` 
                : 'index.html';
            
            // Update all back links on the page
            const backLinks = document.querySelectorAll('a[href="index.html"]');
            backLinks.forEach(link => {
                link.href = backUrl;
            });
        }

        async function loadItemDetails() {
            try {
                // Search for the specific item using direct API parameters (not KVP match)
                // includeFaces: this view captions each face crop, so it needs the (faceIndex,
                // label) pairing the item carries. Search result pages do not ask for it.
                const result = await searchItems({
                    name: itemName,
                    folder: itemFolder || null,
                    howmany: 1,
                    includeFaces: true
                });

                if (result.items && result.items.length > 0) {
                    renderItem(result.items[0]);
                    // Load attributes if we have datasource info
                    if (dataSourceName && dataSourceType) {
                        await loadItemAttributes();
                    }
                } else {
                    showError('Item not found');
                }
            } catch (error) {
                showError('Failed to load item: ' + error.message);
            }
        }

        /**
         * Re-read what a rename changed: the face labels (from the item) and the detectedface
         * results (from the attributes). Deliberately not loadItemDetails() - that re-runs
         * renderItem, which registers the delete-button listener and would double-register it.
         */
        async function refreshFacesAndAttributes() {
            const result = await searchItems({
                name: itemName,
                folder: itemFolder || null,
                howmany: 1,
                includeFaces: true
            });
            if (currentItem && result.items && result.items.length > 0) {
                currentItem.faces = result.items[0].faces || [];
            }
            await loadItemAttributes();
        }

        async function loadItemAttributes() {
            try {
                const attributes = await getItemAttributes(dataSourceName, dataSourceType, itemName, itemFolder || null);
                renderAttributes(attributes);
            } catch (error) {
                console.error('Failed to load attributes:', error);
                $('attributesContent').style.display = 'block';
                $('attributesList').innerHTML = `<div class="alert alert-error">Failed to load attributes: ${escapeHtml(error.message)}</div>`;
            }
        }

        /**
         * Escape special regex characters
         */
        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        /**
         * Extract search terms from search string, handling quoted phrases
         */
        function extractSearchTerms(searchStr) {
            const terms = [];
            // Match quoted phrases (with double or single quotes) and individual words
            const regex = /"([^"]+)"|'([^']+)'|(\S+)/g;
            let match;

            while ((match = regex.exec(searchStr)) !== null) {
                // match[1] = double-quoted phrase, match[2] = single-quoted phrase, match[3] = individual word
                const term = match[1] || match[2] || match[3];
                if (term && term.length > 0) {
                    terms.push(term);
                }
            }

            return terms;
        }

        /**
         * Apply highlighting to a value based on search context
         */
        function highlightValue(value, key) {
            let highlighted = escapeHtml(value);

            // 1. Highlight searchString terms (including quoted phrases)
            if (searchString) {
                const terms = extractSearchTerms(searchString);
                // Sort by length descending to highlight longer phrases first
                terms.sort((a, b) => b.length - a.length);
                terms.forEach(term => {
                    const regex = new RegExp(`(${escapeRegex(term)})`, 'gi');
                    highlighted = highlighted.replace(regex, '<mark>$1</mark>');
                });
            }

            // 2. Highlight LIKE/EQUAL condition matches for this key
            searchConditions.forEach(cond => {
                if (cond.name.toLowerCase() === key.toLowerCase()) {
                    if (cond.operation === 'LIKE' || cond.operation === 'EQUAL') {
                        const searchValue = cond.value.replace(/%/g, '');
                        const regex = new RegExp(`(${escapeRegex(searchValue)})`, 'gi');
                        highlighted = highlighted.replace(regex, '<mark>$1</mark>');
                    }
                }
            });

            return highlighted;
        }

        /**
         * Build URL for detected face crop image using the utility function
         */
        function buildFaceCropUrlForItem(faceIndex) {
            if (!dataSourceType || !dataSourceName || !currentItem) return null;
            return buildFaceCropUrl(dataSourceType, dataSourceName, currentItem.folder || '', currentItem.name, faceIndex);
        }

        function renderAttributes(attributes) {
            if (!attributes || attributes.length === 0) {
                return; // Don't show the card if no attributes
            }

            $('attributesContent').style.display = 'block';

            // Group attributes by key for better display
            const grouped = {};
            attributes.forEach(attr => {
                if (!grouped[attr.key]) {
                    grouped[attr.key] = [];
                }
                grouped[attr.key].push(attr.value);
            });

            // Check if a preview is available by attempting to fetch it
            if (currentItem && dataSourceName && dataSourceType) {
                const previewUrl = buildPreviewUrl(dataSourceType, dataSourceName, currentItem.folder || '', currentItem.name);
                
                // Try to fetch preview with HEAD request to check if it exists
                fetch(previewUrl, { method: 'HEAD' })
                    .then(response => {
                        if (response.status === 200) {
                            // Preview exists (200 OK), add it to file information section
                            // Note: 204 No Content means preview not available
                            const downloadUrl = buildDownloadUrl(dataSourceType, dataSourceName, currentItem.folder || '', currentItem.name);
                            const inlineUrl = downloadUrl + (downloadUrl.includes('?') ? '&' : '?') + 'inline=true';
                            // Only use the full file URL when the browser can render the type natively in an <img> tag.
                            // For PDFs, TIFF, HEIC, etc. fall back to the JPEG preview thumbnail.
                            const mimeType = (currentItem.mimeType || '').toLowerCase().split(';')[0].trim();
                            const lightboxUrl = BROWSER_IMAGE_TYPES.has(mimeType) ? inlineUrl : previewUrl;
                            const previewHtml = `
                                <div class="detail-label">Preview</div>
                                <div class="detail-value">
                                    <img src="${previewUrl}" data-fullurl="${lightboxUrl}" alt="${escapeHtml(currentItem.name)}" class="item-preview-image">
                                </div>
                            `;
                            // Append to existing details
                            $('itemDetails').innerHTML += previewHtml;
                        }
                    })
                    .catch(err => {
                        // Preview not available, silently ignore
                        console.debug('Preview not available for item:', currentItem.name);
                    });
            }

            // Format key names for display
            const formatKey = (key) => {
                return key.split('_').map(word =>
                    word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                ).join(' ');
            };

            // Keys containing "content" should preserve whitespace (long-form text)
            const shouldPreserveWhitespace = (key) => key.toLowerCase().includes('content');

            // facecount drives the face thumbnails: the UI iterates 0..N-1 and asks for one crop
            // per index. The caption comes from the item's own faces list - the (faceIndex, label)
            // pairing the item query returns - so a name always belongs to the face above it. The
            // detectedface attribute carries the same names but no face index and no ordering, so
            // it can never be zipped against the crops client-side.
            const isFaceCountKey = (key) => key.toLowerCase() === 'facecount';

            // faceIndex -> label, absent for a face with no identity: recognition disabled, not yet
            // drained, skipped, or its group cleared by a model change. Such a face renders as a
            // plain crop - no caption, no rename affordance, nothing to act on.
            const faceLabels = new Map(
                ((currentItem && currentItem.faces) || [])
                    .filter(face => face.label)
                    .map(face => [face.faceIndex, face.label])
            );

            // Attributes arrive ORDER BY key, so the detectedface* keys sort ahead of 'facecount'
            // and the crops would render below the rows describing them. Lift the face grid to the
            // head of that family. The anchor is the first detectedface* key rather than
            // 'detectedface' itself so the grid still leads the block when detection runs without
            // recognition: then there are no labels, but detection always emits
            // detectedfaceconfidence per face.
            const orderedEntries = Object.entries(grouped);
            const faceCountIndex = orderedEntries.findIndex(([key]) => isFaceCountKey(key));
            const detectedFaceIndex = orderedEntries.findIndex(([key]) => key.toLowerCase().startsWith('detectedface'));
            if (faceCountIndex > detectedFaceIndex && detectedFaceIndex !== -1) {
                const [faceCountEntry] = orderedEntries.splice(faceCountIndex, 1);
                orderedEntries.splice(detectedFaceIndex, 0, faceCountEntry);
            }

            $('attributesList').innerHTML = orderedEntries.map(([key, values]) => {
                const isPreserveWhitespace = shouldPreserveWhitespace(key);
                const valueClass = isPreserveWhitespace ? 'detail-value preserve-whitespace' : 'detail-value';
                // Apply highlighting if search context exists
                const shouldHighlight = searchString || searchConditions.length > 0;

                // Special rendering for detected faces: one cutout per face index
                if (isFaceCountKey(key)) {
                    const faceCount = parseInt(values[0], 10);
                    if (!Number.isFinite(faceCount) || faceCount <= 0) {
                        return '';
                    }
                    const faceContent = Array.from({ length: faceCount }, (_, faceIndex) => {
                        const faceCropUrl = buildFaceCropUrlForItem(faceIndex);
                        if (!faceCropUrl) {
                            return '';
                        }
                        // facecount and the detection rows are committed in one transaction, so a
                        // count without its rows behind it should not occur. The onerror handler
                        // stays anyway: the item view can be open across a reprocess that changes
                        // the count, and a crop can fail for ordinary reasons (the source file
                        // moved, the fetch failed). Hiding the broken image beats a torn layout.
                        const label = faceLabels.get(faceIndex);
                        const captionHtml = label
                            ? `<div class="face-label face-label-named" title="Click to rename">${escapeHtml(label)}</div>`
                            : '';
                        const altText = escapeHtml(label || `Face ${faceIndex + 1}`);
                        return `
                            <div class="face-thumbnail-container">
                                <img src="${faceCropUrl}"
                                     alt="${altText}"
                                     class="face-thumbnail"
                                     onerror="this.parentElement.classList.add('face-thumbnail-error'); this.style.display='none';">
                                ${captionHtml}
                            </div>
                        `;
                    }).join('');
                    return `
                        <div class="detail-label">Faces</div>
                        <div class="detail-value face-thumbnails-grid">${faceContent}</div>
                    `;
                }

                const valueContent = isPreserveWhitespace
                    ? values.map(v => shouldHighlight ? highlightValue(v, key) : escapeHtml(v)).join('\n\n')
                    : values.map(v => shouldHighlight ? highlightValue(v, key) : escapeHtml(v)).join(', ');
                return `
                <div class="detail-label">${formatKey(key)}</div>
                <div class="${valueClass}">${valueContent}</div>
            `;
            }).join('');

            // Click-to-rename, wired only on named faces - an unlabeled crop has nothing to rename.
            // The list is rebuilt on every render, so listeners cannot accumulate.
            $('attributesList').querySelectorAll('.face-label-named').forEach(caption => {
                caption.addEventListener('click', async () => {
                    const oldLabel = caption.textContent;
                    const newLabel = await showPrompt(`Rename "${oldLabel}"`, oldLabel);
                    if (!newLabel || newLabel.trim() === oldLabel) return;
                    const trimmed = newLabel.trim();
                    try {
                        // Renaming onto an existing name MERGES: one person occupies several
                        // clusters when their appearance drifts (most obviously across an age gap),
                        // and sharing a label is the only way to unify them. The server therefore no
                        // longer rejects a collision - which means a typo is now a silent mass merge
                        // that only a recluster can undo. The server cannot tell a merge from a
                        // slip; the person typing can, so ask them.
                        let knownLabels = [];
                        try {
                            knownLabels = (await getFacets('detectedface')).map(f => f.value);
                        } catch (lookupErr) {
                            // Advisory only - never block a rename because the facet read failed.
                        }
                        if (knownLabels.includes(trimmed)
                                && !await showConfirm(
                                    `"${trimmed}" already exists. Merge these faces into "${trimmed}"? `
                                    + 'This cannot be undone by renaming.')) {
                            return;
                        }
                        // Renames the whole group, so re-read both the faces and the attributes:
                        // every crop of this person, here and in the detectedface list, changes.
                        await renameFaceLabel(oldLabel, trimmed);
                        await refreshFacesAndAttributes();
                    } catch (err) {
                        showAlert('Could not rename: ' + (err.message || err));
                    }
                });
            });

            // Auto-scroll content fields to first highlight
            if (searchString || searchConditions.length > 0) {
                // Use setTimeout to ensure DOM is updated
                setTimeout(() => {
                    const contentFields = $('attributesList').querySelectorAll('.detail-value.preserve-whitespace');
                    contentFields.forEach(field => {
                        const firstMark = field.querySelector('mark');
                        if (firstMark) {
                            // Get accurate positions using getBoundingClientRect
                            const fieldRect = field.getBoundingClientRect();
                            const markRect = firstMark.getBoundingClientRect();

                            // Calculate the position of the mark relative to the field's current scroll position
                            const markRelativeTop = markRect.top - fieldRect.top + field.scrollTop;

                            // Scroll to show mark near top with some context (20px padding)
                            const targetScroll = Math.max(0, markRelativeTop - 20);
                            field.scrollTop = targetScroll;
                        }
                    });
                }, 0);
            }
        }

        function renderItem(item) {
            currentItem = item; // Store for use in renderAttributes
            $('loadingState').style.display = 'none';
            $('itemContent').style.display = 'block';
            const titleHtml = escapeHtml(item.name) + (dataSourceName && dataSourceType ? ` <a class="btn btn-secondary btn-sm" href="${buildDownloadUrl(dataSourceType, dataSourceName, item.folder || '', item.name)}" onclick="event.stopPropagation()" style="margin-left: 1rem;">Download</a>` : '');
            $('itemTitle').innerHTML = titleHtml;
            document.title = `${item.name} - EnterFind`;

            const details = [
                { label: 'Name', value: item.name },
                { label: 'Folder', value: item.folder || 'Root' },
                { label: 'Size', value: formatFileSize(item.sizeBytes) },
                { label: 'Type', value: item.mimeType || 'Unknown' },
                { label: 'Date Created', value: formatDate(item.dateCreated) },
                { label: 'Date Modified', value: formatDate(item.dateModified) }
            ];

            $('itemDetails').innerHTML = details.map(d => `
                <div class="detail-label">${d.label}</div>
                <div class="detail-value">${escapeHtml(d.value)}</div>
            `).join('');

            if (dataSourceName && dataSourceType) {
                $('deleteFileCard').style.display = 'block';
                $('deleteFileBtn').addEventListener('click', handleDeleteFile);
            }
        }

        async function handleDeleteFile() {
            if (!await showConfirm(`Delete "${itemName}"? This will permanently remove the file from the data source and cannot be undone.`)) {
                return;
            }

            const btn = $('deleteFileBtn');
            btn.disabled = true;
            btn.textContent = 'Deleting...';

            try {
                await deleteItem(dataSourceName, dataSourceType, itemName, itemFolder || null);
                await showAlert(`"${itemName}" was deleted successfully.`);
                window.location.href = 'index.html';
            } catch (error) {
                await showAlert(`Failed to delete file: ${error.message}`);
                btn.disabled = false;
                btn.textContent = 'Delete File';
            }
        }

            

        function showError(message) {
            $('loadingState').style.display = 'none';
            $('errorState').style.display = 'block';
            $('errorState').textContent = message;
        }

        // ===== Lightbox =====
        const lightbox = document.getElementById('imageLightbox');
        const lightboxImg = document.getElementById('imageLightboxImg');

        function openLightbox(src, alt) {
            lightboxImg.src = src;
            lightboxImg.alt = alt;
            lightbox.style.display = 'flex';
            document.addEventListener('keydown', closeLightboxOnKey, { once: true });
        }

        function closeLightbox() {
            lightbox.style.display = 'none';
            lightboxImg.src = '';
            document.removeEventListener('keydown', closeLightboxOnKey);
        }

        function closeLightboxOnKey() {
            closeLightbox();
        }

        lightbox.addEventListener('click', closeLightbox);

        // Delegate clicks on preview images (added dynamically)
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('item-preview-image')) {
                const fullUrl = e.target.dataset.fullurl || e.target.src;
                openLightbox(fullUrl, e.target.alt);
            }
        });
    </script>
</body>
</html>
